<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sparrow</title>
    <meta name="description" content="Sparrow, Kyle Heath's writing studio." />
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sparrow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // The colour theme chosen in Settings, put on before the app draws so the page never flashes the wrong colours (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('story-forge.theme');
        var dark = ['violet-night', 'midnight', 'forest', 'ember', 'ink', 'black'];
        if (t && t !== 'auto') { document.documentElement.dataset.theme = t; document.documentElement.dataset.mode = dark.indexOf(t) >= 0 ? 'dark' : 'light'; }
      } catch (e) {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
