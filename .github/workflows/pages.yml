name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The Kindle files the app makes must pass the W3C's EPUBCheck with no errors or warnings (tests/epubcheck/).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: bash tests/epubcheck/run.sh
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The page checks in a real WebKit, the engine Kyle's iPad runs (tests/webkit/): typing in a long chapter, saving
  # offline, moving a chapter, keeping a change, the Rewrite light, the team watcher. On every pull request; a red one
  # means the iPad would break.
  webkit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb
      - run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          bash tests/webkit/run.sh

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # GitHub names each Pages deployment after its commit. If one stalls and is cancelled (2026-11-05: "updating_pages"
    # for ten minutes, then a timeout), re-running the same commit is cancelled at once; a new commit on main deploys.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
